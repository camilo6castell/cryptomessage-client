name: Local AI Stack
version: 1.0.1
schema: v1

########################################################
# MODELS
########################################################

models:
  ########################################################
  # PRIMARY CODING MODEL
  ########################################################

  - name: Qwen3.5 9B Agent
    model: qwen3.5:9b

    provider: openai
    apiBase: http://127.0.0.1:52625/v1
    apiKey: flm

    requestOptions:
      timeout: 600000


    roles:
      - chat
      - edit
      - apply

    # Comentado temporalmente para evitar que Continue rompa el parser de FLM
    capabilities:
      - tool_use

    defaultCompletionOptions:
      contextLength: 32768 # 16384 # 32768
      temperature: 0.0
      topP: 0.95
      reasoning: true

  ########################################################
  # SECONDARY CODING MODEL
  ########################################################

  - name: DeepSeek R1 8B Agent
    model: deepseek-r1:8b

    provider: openai
    apiBase: http://127.0.0.1:52625/v1
    apiKey: flm

    requestOptions:
      timeout: 600000

    roles:
      - chat
      - edit
      - apply

    capabilities:
      - tool_use

    defaultCompletionOptions:
      contextLength: 32768 # 16384 # 32768
      temperature: 0.0
      topP: 0.95
      reasoning: true

  ########################################################
  # HEAVY REASONING MODEL
  ########################################################

  - name: GPT-OSS 20B
    model: gpt-oss:20b

    provider: openai
    apiBase: http://127.0.0.1:52625/v1
    apiKey: flm

    requestOptions:
      timeout: 600000

    roles:
      - chat

    capabilities:
      - tool_use

    defaultCompletionOptions:
      contextLength: 32768 # 16384 # 32768
      maxTokens: 4096
      temperature: 0.1
      topP: 0.95

  ########################################################
  # AUTOCOMPLETE
  ########################################################

  # - name: Qwen3.5 Autocomplete
  #   model: qwen3.5:2b

  #   provider: flm
  #   apiBase: http://127.0.0.1:52625/v1
  #   provider: ollama
  #   apiBase: http://127.0.0.1:11434

  #   roles:
  #     - autocomplete

  #   autocompleteOptions:
  #     disable: false
  #     debounceDelay: 150
  #     maxPromptTokens: 768
  #     onlyMyCode: true
  #     useCache: true
  #     useImports: true
  #     useRecentlyEdited: true
  #     useRecentlyOpened: true

  #   requestOptions:
  #     timeout: 10000

  #   defaultCompletionOptions:
  #     maxTokens: 128
  #     temperature: 0.0

  ########################################################
  # EMBEDDINGS
  ########################################################

  - name: Snowflake Arctic Embed
    model: snowflake-arctic-embed:latest
  # - name: BGE-M3
  #    model: bge-m3:latest

    provider: ollama
    apiBase: http://127.0.0.1:11434
    #apiBase: http://192.168.2.24:11434 # server

    roles:
      - embed

    embedOptions:
      maxChunkSize: 512 #1024
      maxBatchSize: 32

########################################################
# RERANKER
########################################################

  - name: BGE Reranker
    model: bbjson/bge-reranker-base:latest

    provider: ollama
    apiBase: http://127.0.0.1:11434
    roles:
      - rerank

########################################################
# CONTEXT PROVIDERS
########################################################

context:
  - provider: codebase
  - provider: repo-map
  - provider: currentFile
  - provider: file
  - provider: tree
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: open

########################################################
# RULES
########################################################

rules:
  # Repository awareness
  - "Inspect the repository before proposing changes."
  - "Reuse the existing architecture, abstractions and coding patterns."
  - "Prefer modifying existing code over creating new files."

  # Reliability
  - "Never invent APIs, files, classes, functions or libraries."
  - "Ask for clarification when repository context is insufficient."
  - "Never remove existing functionality unless explicitly requested."

  # Code quality
  - "Generate production-quality code."
  - "Keep edits minimal, localized and easy to review."
  - "Follow the project's naming conventions and formatting."
  - "Maintain strict typing whenever possible."
  - "Avoid duplicated code."
  - "Prefer composition over duplication."

  # Architecture
  - "Preserve the project's architecture."
  - "Explain architectural decisions when modifications span multiple files."

  # General behaviour
  - "Act as an expert senior software engineer."
